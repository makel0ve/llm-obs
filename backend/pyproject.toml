[project]
name = "llm-obs-backend"
version = "0.44.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.136",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "taskiq-fastapi>=0.3",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "aioboto3>=12.0",
    "tenacity>=8.0",
    "python-dateutil>=2.9",
    "opentelemetry-proto>=1.0",
    "aiosmtplib>=3.0",
    "gunicorn>=22.0",
    "pydantic[email]>=2.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27",
    "respx>=0.21",
    "factory-boy>=3.3",
    "faker>=25.0",
    "locust>=2.0",
    "pytest-cov>=5.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-jose",
    "types-passlib",
    "types-python-dateutil",
    "types-aioboto3[s3]",
    "python-semantic-release>=9.0,<10.0",
]







[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["__pycache__"]

[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.remote]
url = "ssh://git@github.com/makel0ve/llm-obs.git"
ignore_token_for_push = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
