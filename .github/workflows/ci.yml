name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: llmobs_test
          POSTGRES_USER: llmobs
          POSTGRES_PASSWORD: llmobs_test
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[test]"
      - run: cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://llmobs:llmobs_test@localhost/llmobs_test
      - run: cd backend && pytest tests/ --cov=app --cov-report=xml --cov-fail-under=40
        env:
          DATABASE_URL: postgresql+asyncpg://llmobs:llmobs_test@localhost/llmobs_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-testing-only-32chars
          ENVIRONMENT: test
      - uses: codecov/codecov-action@v4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[test,dev]"
      - run: ruff check .
      - run: mypy backend/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit safety
      - run: bandit -r backend/app -ll
      - run: bandit -r backend/app --severity-level medium --confidence-level medium

  docker:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image prefix
        id: image-prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}/backend:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}/frontend:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "python-semantic-release>=9,<10"
      - run: semantic-release version --skip-build
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: semantic-release publish
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
