name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: llmobs_test
          POSTGRES_USER: llmobs_owner
          POSTGRES_PASSWORD: llmobs_owner_test # pragma: allowlist secret
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://llmobs_app:llmobs_app_test@localhost/llmobs_test # pragma: allowlist secret
      MIGRATION_DATABASE_URL: postgresql+asyncpg://llmobs_owner:llmobs_owner_test@localhost/llmobs_test # pragma: allowlist secret
      POSTGRES_USER: llmobs_owner
      POSTGRES_APP_USER: llmobs_app
      POSTGRES_APP_PASSWORD: llmobs_app_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-for-testing-only-32chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[test]"
      - run: cd backend && pytest tests/integration/test_migration_smoke.py -q
        env:
          RUN_MIGRATION_SMOKE: "1"
      - run: cd backend && alembic upgrade head
      - run: cd backend && pytest tests/integration/test_runtime_role_rls.py -q
        env:
          RUN_RUNTIME_RLS_TESTS: "1"
      - run: python scripts/backend_critical_tests.py
      - run: cd backend && pytest tests/ --cov=app --cov-report=xml --cov-fail-under=40
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: cd sdk && pip install -e ".[test]"
      - run: cd sdk && pytest llm_obs_tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  e2e-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: python -m pip install -e ./sdk
      - run: cp backend/.env.example backend/.env
      - name: Start Compose stack
        run: docker compose -f infra/docker-compose.yml up -d --build postgres redis redis-queue minio backend worker
      - name: Apply migrations
        run: docker compose -f infra/docker-compose.yml exec -T backend alembic upgrade head
      - name: Run E2E Compose smoke
        run: python scripts/e2e_compose_smoke.py
      - name: Compose logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200 backend worker postgres redis redis-queue minio
      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[test,dev]"
      - run: cd sdk && pip install -e ".[test]"
      - run: ruff check .
      - run: mypy backend/
      - run: mypy sdk/llm_obs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install bandit safety detect-secrets==1.5.0
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --no-verify
      - run: bandit -r backend/app -ll
      - run: bandit -r backend/app --severity-level medium --confidence-level medium

  docker:
    needs: [test, sdk-test, frontend-build, e2e-compose, lint, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare image prefix
        id: image-prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}/backend:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}/frontend:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    needs: [test, sdk-test, frontend-build, e2e-compose, lint, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Use SSH for release pushes
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RELEASE_DEPLOY_KEY }}" > ~/.ssh/release_deploy_key
          chmod 600 ~/.ssh/release_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          ssh -i ~/.ssh/release_deploy_key -o IdentitiesOnly=yes -T git@github.com || true
          git remote -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install "python-semantic-release>=9,<10"
      - run: semantic-release version --skip-build
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: semantic-release publish
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-release-to-develop:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release-sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Use SSH for sync branch pushes
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RELEASE_DEPLOY_KEY }}" > ~/.ssh/release_deploy_key
          chmod 600 ~/.ssh/release_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
      - name: Create release sync branch
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop --tags

          main_version="$(git show origin/main:backend/pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p')"
          develop_version="$(git show origin/develop:backend/pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p')"
          echo "version=${main_version}" >> "$GITHUB_OUTPUT"

          if [ "$main_version" = "$develop_version" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="sync/release-${main_version}-to-develop"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch" origin/develop
          git merge --ff-only origin/main
          git commit --allow-empty -m "chore: trigger ci for release sync"
          git push --force-with-lease origin "$branch"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Open release sync pull request
        if: steps.sync.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set RELEASE_PR_TOKEN to a PAT with repo pull request permissions so release sync PR checks can run."
            exit 1
          fi

          pr_number="$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --base develop \
              --title "Sync release v${VERSION} to develop" \
              --body "Syncs the semantic-release commit for v${VERSION} from main back into develop."
          else
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "Sync release v${VERSION} to develop" \
              --body "Syncs the semantic-release commit for v${VERSION} from main back into develop."
          fi
